name: Run-Scrapers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'  

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.13' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 0.5.7
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv sync --all-extras
          cd backend/scripts

      - name: Run Powerball
        run:
          uv run powerscrape

      - name: Run Mega Millions
        run:
          uv run megascrape